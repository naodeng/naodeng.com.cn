<svg xmlns="http://www.w3.org/2000/svg" width="650" height="780" viewBox="0 0 650 780" role="img" aria-labelledby="title desc"><title id="title">T 型与梳子型能力结构</title><desc id="desc">A T-shaped tester has broad foundational knowledge and one deeper specialty. A comb-shaped tester has broad interests and depth in several related areas.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#8797ae"/></marker></defs><rect width="650" height="780" rx="22" fill="#f7f9fc"/><text x="30" y="46" text-anchor="start" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="26" font-weight="700">T 型与梳子型能力结构</text><rect x="24" y="68" width="602" height="300" rx="16" fill="#fff" stroke="#d8e0ec" stroke-width="1.5"/><text x="50" y="108" text-anchor="start" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="22" font-weight="700">T 型能力：广泛基础，一个深度方向</text><rect x="50" y="130" width="550" height="68" rx="16" fill="#e8f0ff" stroke="#d8e0ec" stroke-width="1.5"/><text x="325" y="173" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="20" font-weight="600">知识广度：业务、测试、技术、协作</text><path d="M325 201 L325 224" fill="none" stroke="#8797ae" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="170" y="230" width="310" height="88" rx="16" fill="#f3eaff" stroke="#d8e0ec" stroke-width="1.5"/><text x="325" y="282" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="22" font-weight="700">一个主要专业方向</text><rect x="24" y="388" width="602" height="360" rx="16" fill="#fff" stroke="#d8e0ec" stroke-width="1.5"/><text x="50" y="428" text-anchor="start" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="22" font-weight="700">梳子型能力：广泛兴趣，多个深度方向</text><rect x="50" y="450" width="550" height="68" rx="16" fill="#e3f7f3" stroke="#d8e0ec" stroke-width="1.5"/><text x="325" y="493" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="20" font-weight="600">兴趣广度：业务、测试、技术、产品等</text><path d="M145 521 L145 542" fill="none" stroke="#8797ae" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="550" width="150" height="150" rx="16" fill="#fff2d2" stroke="#d8e0ec" stroke-width="1.5"/><text x="145" y="632" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="20" font-weight="700">业务质量</text><path d="M325 521 L325 542" fill="none" stroke="#8797ae" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="250" y="550" width="150" height="150" rx="16" fill="#f3eaff" stroke="#d8e0ec" stroke-width="1.5"/><text x="325" y="632" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="20" font-weight="700">自动化与平台</text><path d="M505 521 L505 542" fill="none" stroke="#8797ae" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="430" y="550" width="150" height="150" rx="16" fill="#ffe8e3" stroke="#d8e0ec" stroke-width="1.5"/><text x="505" y="632" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="20" font-weight="700">质量赋能</text></svg>
