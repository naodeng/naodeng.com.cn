<svg xmlns="http://www.w3.org/2000/svg" width="650" height="700" viewBox="0 0 650 700" role="img" aria-labelledby="title desc"><title id="title">Career growth through small, steady investments</title><desc id="desc">A steady learning loop: small investments, practical work, shared feedback, and reflection.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#8797ae"/></marker></defs><rect width="650" height="700" rx="22" fill="#f7f9fc"/><text x="30" y="46" text-anchor="start" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="26" font-weight="700">Career growth through small, steady investments</text><rect x="55" y="100" width="540" height="105" rx="16" fill="#e8f0ff" stroke="#d8e0ec" stroke-width="1.5"/><text x="325" y="148.5" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="22" font-weight="700">Small investments</text><text x="325" y="177.5" text-anchor="middle" fill="#53627a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="17" font-weight="400">Meetups, reading, writing, conversation</text><rect x="55" y="255" width="540" height="105" rx="16" fill="#e3f7f3" stroke="#d8e0ec" stroke-width="1.5"/><text x="325" y="303.5" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="22" font-weight="700">Practice at work</text><text x="325" y="332.5" text-anchor="middle" fill="#53627a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="17" font-weight="400">Try an approach and keep evidence</text><rect x="55" y="410" width="540" height="105" rx="16" fill="#f3eaff" stroke="#d8e0ec" stroke-width="1.5"/><text x="325" y="458.5" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="22" font-weight="700">Share and get feedback</text><text x="325" y="487.5" text-anchor="middle" fill="#53627a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="17" font-weight="400">Learn with your team and community</text><rect x="55" y="565" width="540" height="105" rx="16" fill="#fff2d2" stroke="#d8e0ec" stroke-width="1.5"/><text x="325" y="613.5" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="22" font-weight="700">Reflect and adjust</text><text x="325" y="642.5" text-anchor="middle" fill="#53627a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="17" font-weight="400">Rest, review, take the next step</text><path d="M325 208 L325 247" fill="none" stroke="#8797ae" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M325 363 L325 402" fill="none" stroke="#8797ae" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M325 518 L325 557" fill="none" stroke="#8797ae" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M595 618 H620 V152 H600" fill="none" stroke="#4265df" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/></svg>
