<svg xmlns="http://www.w3.org/2000/svg" width="650" height="735" viewBox="0 0 650 735" role="img" aria-labelledby="title desc"><title id="title">Follow an e-commerce payment across systems</title><desc id="desc">A payment flow crosses payment, order, inventory, accounting, and refund systems. Each boundary can introduce a distinct quality risk.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#8797ae"/></marker></defs><rect width="650" height="735" rx="22" fill="#f7f9fc"/><text x="30" y="46" text-anchor="start" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="26" font-weight="700">Follow an e-commerce payment across systems</text><rect x="35" y="100" width="280" height="82" rx="16" fill="#e8f0ff" stroke="#d8e0ec" stroke-width="1.5"/><text x="175" y="137" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="20" font-weight="700">Customer starts payment</text><path d="M175 184 L175 217" fill="none" stroke="#8797ae" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="35" y="225" width="280" height="82" rx="16" fill="#e3f7f3" stroke="#d8e0ec" stroke-width="1.5"/><text x="175" y="262" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="20" font-weight="700">Payment service</text><path d="M175 309 L175 342" fill="none" stroke="#8797ae" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="35" y="350" width="280" height="82" rx="16" fill="#fff2d2" stroke="#d8e0ec" stroke-width="1.5"/><text x="175" y="387" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="20" font-weight="700">Order state</text><path d="M175 434 L175 467" fill="none" stroke="#8797ae" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="35" y="475" width="280" height="82" rx="16" fill="#ffe8e3" stroke="#d8e0ec" stroke-width="1.5"/><text x="175" y="512" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="20" font-weight="700">Inventory</text><path d="M175 559 L175 592" fill="none" stroke="#8797ae" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="35" y="600" width="280" height="82" rx="16" fill="#f3eaff" stroke="#d8e0ec" stroke-width="1.5"/><text x="175" y="637" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="20" font-weight="700">Accounting</text><path d="M315 390 H370" fill="none" stroke="#4265df" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="382" y="350" width="235" height="82" rx="16" fill="#e8f0ff" stroke="#d8e0ec" stroke-width="1.5"/><text x="499.5" y="387" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="19" font-weight="700">Refund and after-sales</text><rect x="350" y="110" width="270" height="82" rx="16" fill="#ffe8e3" stroke="#d8e0ec" stroke-width="1.5"/><text x="485" y="147" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="17" font-weight="700">Repeat request or charge</text><rect x="350" y="235" width="270" height="82" rx="16" fill="#ffe8e3" stroke="#d8e0ec" stroke-width="1.5"/><text x="485" y="272" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="17" font-weight="700">Delayed callback or stale state</text><rect x="350" y="475" width="270" height="82" rx="16" fill="#ffe8e3" stroke="#d8e0ec" stroke-width="1.5"/><text x="485" y="512" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="17" font-weight="700">Inventory not released</text><rect x="350" y="600" width="270" height="82" rx="16" fill="#ffe8e3" stroke="#d8e0ec" stroke-width="1.5"/><text x="485" y="637" text-anchor="middle" fill="#17243a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="17" font-weight="700">Refund not recorded</text><text x="350" y="77" text-anchor="start" fill="#53627a" font-family="Arial, &apos;Noto Sans SC&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="18" font-weight="700">Potential risk</text></svg>
