<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1160" viewBox="0 0 820 1160" role="img" aria-labelledby="title desc">
<title id="title">How Vibe Testing Works</title>
<desc id="desc">A conversational, iterative five-step process: define intent, expand scenarios with AI, execute and observe, adapt tests when the interface changes, and have a person validate the result against the intent.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#8797ae"/></marker>
  <marker id="loop-arrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#4265df"/></marker>
</defs>
<rect width="820" height="1160" rx="24" fill="#f7f9fc"/>
<text x="52" y="58" fill="#17243a" font-family="Arial, sans-serif" font-size="28" font-weight="700">How Vibe Testing Works</text>
<text x="52" y="91" fill="#53627a" font-family="Arial, sans-serif" font-size="17">A conversational, iterative loop rather than a linear script</text>
<path d="M410 265 V302 M410 425 V462 M410 585 V622 M410 745 V782" fill="none" stroke="#8797ae" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M150 890 H84 V202 H149" fill="none" stroke="#4265df" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#loop-arrow)"/>
<text x="48" y="550" transform="rotate(-90 48 550)" text-anchor="middle" fill="#4265df" font-family="Arial, sans-serif" font-size="15" font-weight="700">Refine intent and repeat</text>
<g><rect x="150" y="145" width="540" height="120" rx="18" fill="#e8f0ff" stroke="#d8e0ec"/><circle cx="190" cy="185" r="20" fill="#fff" stroke="#4265df"/><text x="190" y="191" text-anchor="middle" fill="#4265df" font-family="Arial, sans-serif" font-size="16" font-weight="700">1</text><text x="230" y="192" fill="#17243a" font-family="Arial, sans-serif" font-size="23" font-weight="700">Define the intent</text><text x="230" y="225" fill="#53627a" font-family="Arial, sans-serif" font-size="17">Describe expected behavior in plain language</text></g>
<g><rect x="150" y="305" width="540" height="120" rx="18" fill="#e3f7f3" stroke="#d8e0ec"/><circle cx="190" cy="345" r="20" fill="#fff" stroke="#2c9c85"/><text x="190" y="351" text-anchor="middle" fill="#2c9c85" font-family="Arial, sans-serif" font-size="16" font-weight="700">2</text><text x="230" y="352" fill="#17243a" font-family="Arial, sans-serif" font-size="23" font-weight="700">AI expands the scenarios</text><text x="230" y="385" fill="#53627a" font-family="Arial, sans-serif" font-size="17">Happy paths, edge cases, and boundary tests</text></g>
<g><rect x="150" y="465" width="540" height="120" rx="18" fill="#f3eaff" stroke="#d8e0ec"/><circle cx="190" cy="505" r="20" fill="#fff" stroke="#8a63c7"/><text x="190" y="511" text-anchor="middle" fill="#8a63c7" font-family="Arial, sans-serif" font-size="16" font-weight="700">3</text><text x="230" y="512" fill="#17243a" font-family="Arial, sans-serif" font-size="23" font-weight="700">Execute and observe</text><text x="230" y="545" fill="#53627a" font-family="Arial, sans-serif" font-size="17">Across browsers, devices, and environments</text></g>
<g><rect x="150" y="625" width="540" height="120" rx="18" fill="#fff3dc" stroke="#d8e0ec"/><circle cx="190" cy="665" r="20" fill="#fff" stroke="#c4871d"/><text x="190" y="671" text-anchor="middle" fill="#c4871d" font-family="Arial, sans-serif" font-size="16" font-weight="700">4</text><text x="230" y="672" fill="#17243a" font-family="Arial, sans-serif" font-size="23" font-weight="700">The system attempts to self-heal</text><text x="230" y="705" fill="#53627a" font-family="Arial, sans-serif" font-size="17">Adapts when the UI or workflow changes</text></g>
<g><rect x="150" y="785" width="540" height="120" rx="18" fill="#e6f2ff" stroke="#d8e0ec"/><circle cx="190" cy="825" r="20" fill="#fff" stroke="#3777bd"/><text x="190" y="831" text-anchor="middle" fill="#3777bd" font-family="Arial, sans-serif" font-size="16" font-weight="700">5</text><text x="230" y="832" fill="#17243a" font-family="Arial, sans-serif" font-size="23" font-weight="700">A person validates intent</text><text x="230" y="865" fill="#53627a" font-family="Arial, sans-serif" font-size="17">Confirm the result matches what was meant</text></g>
<text x="150" y="980" fill="#344765" font-family="Arial, sans-serif" font-size="16">AI confirms that the software runs. A person confirms that it runs as intended.</text>
<text x="150" y="1008" fill="#53627a" font-family="Arial, sans-serif" font-size="16">Self-healing assists test maintenance; it does not replace QA judgment.</text>
</svg>
