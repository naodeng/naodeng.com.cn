<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Quality loop from a personal Prompt to a team Skill</title>
  <desc id="desc">Extract stable practice from real recurring work, package and version a Skill, evaluate varied samples, pilot with a team, record failures, revise, and regress on the same samples.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#138a72"/></marker>
    <style>
      .bg{fill:#f7f9ff}.title{font:700 32px system-ui,-apple-system,sans-serif;fill:#172554}.subtitle{font:400 17px system-ui,-apple-system,sans-serif;fill:#475569}.card{fill:#fff;stroke:#cbd5ff;stroke-width:2}.num{fill:#138a72}.numtext{font:700 20px system-ui,sans-serif;fill:#fff;text-anchor:middle}.head{font:700 20px system-ui,-apple-system,sans-serif;fill:#172554}.body{font:400 16px system-ui,-apple-system,sans-serif;fill:#334155}.arrow{fill:none;stroke:#138a72;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}.loop{font:600 15px system-ui,-apple-system,sans-serif;fill:#087f5b}
    </style>
  </defs>
  <rect class="bg" width="1200" height="700" rx="24"/>
  <text class="title" x="64" y="58">From Prompts to Skills: a quality loop</text>
  <text class="subtitle" x="64" y="88">Capture a method reviewed with samples and a team; maintain the Skill as evidence changes.</text>
  <path class="arrow" d="M400 205H430"/><path class="arrow" d="M770 205H800"/>
  <path class="arrow" d="M960 300V380"/><path class="arrow" d="M800 485H770"/><path class="arrow" d="M430 485H400"/><path class="arrow" d="M240 390V300"/>
  <text class="loop" x="1030" y="350">Review again</text><text class="loop" x="64" y="355">Next round</text>
  <g transform="translate(80 120)"><rect class="card" width="320" height="180" rx="18"/><circle class="num" cx="34" cy="36" r="20"/><text class="numtext" x="34" y="43">1</text><text class="head" x="68" y="43">Collect real tasks</text><text class="body" x="26" y="88"><tspan x="26">Keep redacted requirements, Prompts,</tspan><tspan x="26" dy="27">outputs, human edits, and findings.</tspan></text></g>
  <g transform="translate(440 120)"><rect class="card" width="320" height="180" rx="18"/><circle class="num" cx="34" cy="36" r="20"/><text class="numtext" x="34" y="43">2</text><text class="head" x="68" y="43">Extract stable practice</text><text class="body" x="26" y="88"><tspan x="26">Separate repeatable steps from project</tspan><tspan x="26" dy="27">rules; define input, evidence, output.</tspan></text></g>
  <g transform="translate(800 120)"><rect class="card" width="320" height="180" rx="18"/><circle class="num" cx="34" cy="36" r="20"/><text class="numtext" x="34" y="43">3</text><text class="head" x="68" y="43">Package and version</text><text class="body" x="26" y="88"><tspan x="26">Document scope, owner, references,</tspan><tspan x="26" dy="27">and the reason for each change.</tspan></text></g>
  <g transform="translate(800 390)"><rect class="card" width="320" height="180" rx="18"/><circle class="num" cx="34" cy="36" r="20"/><text class="numtext" x="34" y="43">4</text><text class="head" x="68" y="43">Evaluate representative samples</text><text class="body" x="26" y="88"><tspan x="26">Cover complete, missing, conflicting,</tspan><tspan x="26" dy="27">and boundary cases; check gaps and edits.</tspan></text></g>
  <g transform="translate(440 390)"><rect class="card" width="320" height="180" rx="18"/><circle class="num" cx="34" cy="36" r="20"/><text class="numtext" x="34" y="43">5</text><text class="head" x="68" y="43">Pilot and record</text><text class="body" x="26" y="88"><tspan x="26">Record inputs, model and Skill versions,</tspan><tspan x="26" dy="27">defects, human edits, and review outcome.</tspan></text></g>
  <g transform="translate(80 390)"><rect class="card" width="320" height="180" rx="18"/><circle class="num" cx="34" cy="36" r="20"/><text class="numtext" x="34" y="43">6</text><text class="head" x="68" y="43">Revise and regress</text><text class="body" x="26" y="88"><tspan x="26">Check fixes on old samples, then add</tspan><tspan x="26" dy="27">new ones to check transfer to new work.</tspan></text></g>
  <text class="subtitle" x="64" y="635">Reevaluate and record limits when business rules, references, models, or host tools change.</text>
</svg>
