<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1143" viewBox="0 0 820 1143" role="img" aria-labelledby="title desc">
<title id="title">AI-assisted prose trimming loop</title>
<desc id="desc">AI-assisted prose trimming loop: set scope, classify passages, verify sources, remove only authorized residue, compare safeguards, and route contract changes</desc>
