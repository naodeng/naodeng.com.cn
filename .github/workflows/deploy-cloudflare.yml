name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      submit_all_baidu:
        description: Submit all URLs from the generated sitemap to Baidu
        required: true
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wiki style check (warning mode)
        run: npm run wiki:style:check
        continue-on-error: true

      - name: Wiki style check (strict gate)
        if: ${{ vars.WIKI_STYLE_STRICT == 'true' }}
        run: npm run wiki:style:check:strict

      - name: SEO static check (warning mode)
        run: npm run seo:check
        continue-on-error: true

      - name: SEO static check (strict gate)
        if: ${{ vars.SEO_STRICT == 'true' }}
        run: npm run seo:check:strict

      - name: Clean Astro cache
        run: rm -rf .astro

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      - name: Notify Baidu about URLs
        if: ${{ steps.deploy.conclusion == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.submit_all_baidu)) }}
        continue-on-error: true
        env:
          BAIDU_PUSH_SITE: https://inaodeng.com
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/submit-baidu.mjs \
              --all \
              --sitemap=dist/sitemap-0.xml
          else
            node scripts/submit-baidu.mjs \
              --git-range="${{ github.event.before }}...${{ github.sha }}" \
              --sitemap=dist/sitemap-0.xml
          fi

      - name: Notify IndexNow about changed URLs
        if: ${{ steps.deploy.conclusion == 'success' && github.event_name == 'push' }}
        run: |
          node scripts/submit-indexnow.mjs \
            --git-range="${{ github.event.before }}...${{ github.sha }}" \
            --sitemap=dist/sitemap-0.xml
